services:
  postgres:
    image: postgres:16-alpine
    container_name: viewport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  guacd:
    image: guacamole/guacd:latest
    container_name: viewport-guacd
    restart: unless-stopped
    # --- Optional: DNS so guacd can resolve your remote-target hostnames by
    # name. guacd is the process that actually connects to the VNC/RDP/SSH
    # machines, so if a connection's Host is an internal name, configure it here.
    # Docker Desktop containers don't inherit host corporate/VPN DNS. Uncomment
    # ONE approach and fill in your values, then: docker compose up -d guacd
    #
    # Resolve a whole internal domain via your DNS server:
    # dns:
    #   - 10.0.0.1                       # your internal DNS server IP
    # dns_search:
    #   - sparkanswers.com               # search domain (enables short names)
    #
    # Or pin specific hosts statically (no DNS server needed):
    # extra_hosts:
    #   - "win-box.sparkanswers.com:10.0.0.51"
    # ---
    ports:
      - "4822:4822"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  guacamole:
    image: guacamole/guacamole:latest
    container_name: viewport-guacamole
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: ${GUACD_HOSTNAME}
      POSTGRESQL_HOSTNAME: ${POSTGRESQL_HOSTNAME}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
      POSTGRESQL_USER: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      JSON_SECRET_KEY: ${JSON_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/guacamole/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: viewport-grafana
    restart: unless-stopped
    # --- Optional: DNS so Grafana can resolve datasource hostnames (e.g. an
    # internal Mimir/Prometheus at prometheus.sparkanswers.com). Grafana queries
    # datasources in "proxy" mode, so the Grafana container must resolve the
    # name. Docker Desktop containers don't inherit host corporate/VPN DNS.
    # Uncomment ONE approach, fill in your values, then: docker compose up -d grafana
    #
    # Resolve a whole internal domain via your DNS server:
    # dns:
    #   - 10.0.0.1                       # your internal DNS server IP
    # dns_search:
    #   - sparkanswers.com               # search domain (enables short names)
    #
    # Or pin specific hosts statically (no DNS server needed):
    # extra_hosts:
    #   - "prometheus.sparkanswers.com:10.0.0.20"
    # ---
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ${GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS}
      # Grafana downloads and installs the plugin from the latest GitHub release
      # on startup — no local build required. To develop against a locally-built
      # plugin instead, drop this line and mount ./viewport-app/dist (see below).
      GF_INSTALL_PLUGINS: "https://github.com/SparkAnswers/viewport/releases/latest/download/sparkanswers-viewport-app.zip;sparkanswers-viewport-app"
      JSON_SECRET_KEY: ${JSON_SECRET_KEY}
      UBUNTU_RDP_PASSWORD: ${UBUNTU_RDP_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      # Local dev alternative to GF_INSTALL_PLUGINS: build the plugin
      # (cd viewport-app && npm run build) and uncomment the next line.
      # - ./viewport-app/dist:/var/lib/grafana/plugins/sparkanswers-viewport-app:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous window: first boot downloads the plugin + runs DB migrations.
      start_period: 300s

  nginx:
    image: nginx:alpine
    container_name: viewport-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # Only wait for Grafana to *start*, not to be healthy — first-boot plugin
      # download + DB migrations can be slow, and nginx should come up and proxy
      # regardless (it returns 502 until Grafana is ready, then serves normally).
      grafana:
        condition: service_started
      guacamole:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  test-target:
    build: ./test-target
    container_name: viewport-test-target
    restart: unless-stopped
    ports:
      - "5900:5900"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Second VNC box sharing the same credential — demonstrates the "fleet
  # drill-down" pattern: one credential profile, host picked per panel/variable.
  test-target-2:
    build: ./test-target
    container_name: viewport-test-target-2
    restart: unless-stopped
    ports:
      - "5901:5900"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-target-rdp:
    build: ./test-target-rdp
    container_name: viewport-test-target-rdp
    restart: unless-stopped
    ports:
      # host 3390 -> container 3389 (3389 on the host is often taken by a local RDP server)
      - "3390:3389"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3389 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  grafana_data:
