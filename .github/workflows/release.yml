# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        # Uncomment to enable plugin signing
        # (For more info on how to generate the access policy token see https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token)
        #with:
        # Make sure to save the token in your repository secrets
        #policy_token: $
        # Usage of GRAFANA_API_KEY is deprecated, prefer `policy_token` option above
        #grafana_token: $

      # Also publish a stable-named asset (sparkanswers-viewport-app.zip) so the
      # demo docker-compose can pull it via /releases/latest/download/. This is
      # for the reference stack only; catalog submission uses the versioned,
      # provenance-attested asset produced by build-plugin above.
      - name: Publish stable-named asset for the demo stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pkg-stable && mkdir -p pkg-stable/sparkanswers-viewport-app
          cp -r dist/* pkg-stable/sparkanswers-viewport-app/
          chmod 755 pkg-stable/sparkanswers-viewport-app/gpx_viewport_* || true
          (cd pkg-stable && zip -qr ../sparkanswers-viewport-app.zip sparkanswers-viewport-app)
          gh release upload "${{ github.ref_name }}" sparkanswers-viewport-app.zip --clobber
