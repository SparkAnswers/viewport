# Builds and publishes a GitHub release for a version tag (e.g. v2.2.0).
# Token-free: builds the frontend (standard webpack) + backend (mage, all
# platforms), packages an unsigned plugin zip, and attaches it + its SHA1 to the
# release. Signing is a post-approval step (see docs/PUBLISHING).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend (all platforms)
        run: mage -v buildAll

      - name: Package plugin
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod 755 dist/gpx_viewport_* || true
          rm -rf pkg-out && mkdir -p pkg-out/sparkanswers-viewport-app
          cp -r dist/* pkg-out/sparkanswers-viewport-app/
          # stable name (used by the demo docker-compose via /releases/latest/download)
          (cd pkg-out && zip -qr ../sparkanswers-viewport-app.zip sparkanswers-viewport-app)
          # versioned name + SHA1 (used for catalog submission)
          cp sparkanswers-viewport-app.zip "sparkanswers-viewport-app-${version}.zip"
          sha1sum "sparkanswers-viewport-app-${version}.zip" | cut -d' ' -f1 > "sparkanswers-viewport-app-${version}.zip.sha1"
          echo "sha1=$(cat sparkanswers-viewport-app-${version}.zip.sha1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Unsigned plugin build. SHA1: `${{ steps.package.outputs.sha1 }}`
          files: |
            sparkanswers-viewport-app.zip
            sparkanswers-viewport-app-*.zip
            sparkanswers-viewport-app-*.zip.sha1
